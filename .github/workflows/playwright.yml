name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pulso
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pulso
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, pdo_mysql, mbstring, openssl, fileinfo, tokenizer, xml, ctype, curl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > laravel.log 2>&1 &

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000 > /dev/null; then
              echo "Laravel está respondendo."
              break
            fi

            echo "Aguardando Laravel..."
            sleep 2
          done

          cat laravel.log
          
      - name: Debug Laravel login
        run: |
          echo "=== /login headers ==="
          curl -I http://127.0.0.1:8000/login || true

          echo "=== /login HTML ==="
          curl -L http://127.0.0.1:8000/login -o login.html || true

          echo "=== Procurando formulário de login ==="
          grep -n 'input.*email\|name="email"\|Login\|login' login.html || true

          echo "=== Laravel log ==="
          cat laravel.log

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30